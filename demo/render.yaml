# UMGC Skills Content Engine | DEMO Blueprint (two paid items: one web service, one Postgres)
# The web service runs every worker pool inside itself (EMBEDDED_WORKERS=true).
# Use for orals and walkthroughs. For production scale, use the render.yaml at the top level.
databases:
  - name: skills-engine-demo-db
    plan: 0.1c-256mb
    databaseName: skills_engine
    user: skills_engine

services:
  - type: web
    name: skills-engine-demo
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn engine.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: EMBEDDED_WORKERS
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: {name: skills-engine-demo-db, property: connectionString}
      - key: APP_PASSWORD
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: LIGHTCAST_CLIENT_ID
        sync: false
      - key: LIGHTCAST_CLIENT_SECRET
        sync: false
      - key: LIGHTCAST_LICENSED_PRODUCTS
        value: "false"
